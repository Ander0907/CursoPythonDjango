<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Lista de tareas</title>
    <style>
        body {
            font-family: "Poppins", serif;
            background-color: beige;
            padding-top: 60px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background-color: lightblue;
            -webkit-box-shadow: 2px 2px 13px -4px rgba(0,0,0,0.75);
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
        }

        a, p {
            color: gray;
            text-decoration: none;
        }

        .top-space {
            display: flex;
            justify-content: space-between;
            color: white;
            padding: 10px;
            border-radius: 5px 5px 0 0;
            background: linear-gradient(90deg, rgb(13, 144, 196) 0%, rgb(32, 146, 190) 50%, rgba(184, 161, 161, 0) 100%);
        }

        .top-space a {
            color: white;
        }

        button{
            border-radius: 3px;
            padding: 4px;
            font-family: "Poppins", serif;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        input[type=text],
        input[type=password],
        textarea {
            border: 1px solid #EB796F;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-family: "Poppins", serif;
        }

        label {
            padding-top: 10px !important;
            display: block;
        }

        .work-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background-color: white;
            border-top: 1px solid rgb(225, 225, 225);
        }

        .work-item-title {
            display: flex;
        }

        .work-item-title a {
            margin-left: 10px;
        }

        .work-item-icon {
            height: 20px;
            width: 20px;
            border-radius: 50px;
            background-color: rgb(1, 112, 47);
        }

        .work-item-icon-uncompleted {
            height: 20px;
            width: 20px;
            border-radius: 50px;
            background-color: rgb(168, 172, 167);
        }

        .link-delete {
            font-size: 22px;
            line-height: 0;
        }

        #create-search-work-item-area {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            align-items: center;
        }

        #link-add {
            font-size: 38px;
            color: #246e06;
            text-shadow: 1px 1px #81413B;
        }
    </style>
<body>
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
